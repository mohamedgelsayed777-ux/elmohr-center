plugins { id 'com.android.application' }
android {
    namespace 'com.elmohr.center'
    compileSdk 35
    defaultConfig {
        applicationId 'com.elmohr.center'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }
    signingConfigs {
        release {
            storeFile file('../elmohr-release.jks')
            storePassword 'elmohr123'
            keyAlias 'elmohr'
            keyPassword 'elmohr123'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            debuggable false
        }
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.10.1'
}
