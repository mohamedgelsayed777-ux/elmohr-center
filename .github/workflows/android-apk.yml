name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Create release signing key
        working-directory: android
        run: |
          keytool -genkeypair -v -keystore elmohr-release.jks -storepass elmohr123 -keypass elmohr123 -alias elmohr -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ElMohr Center, OU=ElMohr, O=ElMohr Center, L=Egypt, ST=Cairo, C=EG"

      - name: Build signed release APK
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK
        working-directory: android
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          apksigner verify --verbose app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ElMohr-Center-Android-Release
          path: android/app/build/outputs/apk/release/app-release.apk
